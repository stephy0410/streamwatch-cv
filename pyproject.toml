[project]
name = "streamwatch-cv"
version = "0.1.0"
description = "Centro de monitoreo de computer vision en tiempo real: inferencia YOLO11 sobre cámaras en vivo, eventos, alertas y métricas de operación."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "Stephanie Borrego Arroyo" }]
dependencies = [
    "fastapi>=0.115",
    "jinja2>=3.1",
    "numpy>=1.26",
    "opencv-python>=4.10",
    "prometheus-client>=0.21",
    "psutil>=6.0",
    "pydantic>=2.9",
    "python-multipart>=0.0.12",
    "pyyaml>=6.0",
    "uvicorn>=0.32",
    "yt-dlp>=2025.1.1",
]

[project.optional-dependencies]
# Inferencia real. Se separa para que CI y las pruebas unitarias no descarguen PyTorch.
vision = ["ultralytics>=8.3.0"]

[project.scripts]
streamwatch = "streamwatch.cli:main"

[dependency-groups]
dev = ["httpx>=0.27", "pytest>=8.3", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/streamwatch"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["vision: requiere ultralytics y pesos del modelo (no corre en CI)"]
