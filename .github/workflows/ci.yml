name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Dependencias del sistema para OpenCV
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0
      - name: Instalar (sin el extra vision: no descarga PyTorch)
        run: uv sync --locked --group dev
      - name: Ruff
        run: uv run ruff check . && uv run ruff format --check .
      - name: Pruebas
        run: uv run pytest -m "not vision"
