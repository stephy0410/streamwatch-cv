# Configuración base del monitor (versionada). Los escenarios la sobrescriben con config/scenarios/*.yaml.
# Cada evento guarda config_ref = <config_id>@<sha256[:12]> de la configuración efectiva.
config_id: monitor-v3   # v3: series separadas por modelo + histéresis 0.10 (docs/ALERTAS.md). C1/C2: v1 · S1–S4: v2

sources:
  - id: sheep-barn
    kind: youtube
    uri: https://www.youtube.com/watch?v=SnHke968zAA
    title: "Sheep Barn Cam · Farm Sanctuary (Watkins Glen, NY)"
    domain: agtech
    attribution: "Transmisión pública de Farm Sanctuary powered by explore.org"
    classes: [sheep, person, dog, cow, horse, bird, cat]
  - id: puppy-playroom
    kind: youtube
    uri: https://www.youtube.com/watch?v=h-Z0wCdD3dI
    title: "Puppy Playroom · Warrior Canine Connection (Maryland)"
    domain: animal-care
    attribution: "Transmisión pública de Warrior Canine Connection powered by explore.org"
    classes: [dog, person, cat, sheep, cow, horse, bird]
  - id: city-crossing
    kind: youtube
    uri: https://www.youtube.com/watch?v=dfVK7ld38Ys
    title: "Shibuya Scramble Crossing · FNN (Tokio)"
    domain: smart-city
    attribution: "Transmisión pública de FNNプライムオンライン (Fuji News Network)"
    classes: [person, bicycle, car, motorcycle, bus, truck, umbrella]

sampling:
  interval_s: 1.0          # 1 frame por fuente por segundo; el resto se descarta por muestreo

model:
  name: yolo11s
  weights: models/yolo11s.pt
  sha256: 85a76fe86dd8afe384648546b56a7a78580c7cb7b404fc595f97969322d502d5  # docs/MODELO.md
  expected_name: yolo11s   # versión aprobada para producción
  imgsz: 640
  conf_floor: 0.10         # piso de salida: deja observar la zona de baja confianza
  iou: 0.45
  device: auto             # mps en Apple Silicon, cuda si existe, cpu en otro caso

confidence:                # calibrados con la corrida de referencia (docs/CONFIANZA.md)
  lower: 0.40              # media de P20 por fuente
  upper: 0.65              # media de P50 por fuente
  reference: config/reference/reference-v2.json  # v1 + estadística de frames vacíos; umbrales idénticos

alerts:
  low_confidence:
    window_frames: 20      # ~20 s por fuente
    min_detections: 15
    rate_threshold: 0.6    # por defecto; abajo, por fuente = P95 de la referencia + 0.15
    per_source_threshold: {sheep-barn: 0.35, puppy-playroom: 0.65}
    persistence: 3
    clear_after: 5
    clear_margin: 0.10     # histéresis: cierra solo bajo umbral − 0.10 (barrido con backtest, docs/ESCENARIOS.md S3)
  confidence_shift:
    window_frames: 60      # ~1 min por fuente
    min_detections: 40
    tolerance: 0.15        # caída natural P05 de la referencia ≤ 0.075, más margen
    persistence: 15
    clear_after: 10
    clear_margin: 0.05
    require_same_model: true   # la referencia es de yolo11s: otro modelo = otra serie (no se compara)
  detector_silence:        # frames sin detecciones: el modelo se calla en vez de dudar (hallazgo de C2)
    enabled: true
    window_frames: 20
    empty_share_threshold: 0.25   # referencia: 0 % de frames vacíos en ambas fuentes → max(P95 + 0.15, piso 0.25)
    persistence: 3
    clear_after: 5
    clear_margin: 0.10     # 2 frames de 20
  stream_stale: {max_age_s: 15}
  model_version: {enabled: true}

captures:
  normal_every_s: 60       # muestra de operación normal
  low_conf_every_s: 15     # frames dudosos, como máximo uno cada 15 s por fuente
  low_conf_min_share: 0.5  # frame dudoso: ≥ 50 % de sus detecciones bajo lower
  on_alert: true
  max_width: 800
  jpeg_quality: 75

storage:
  db: data/streamwatch.db
  runs_dir: data/runs
  live_dir: data/live

telemetry:
  prometheus_port: 9108
  resource_every_s: 5
  source_stats_every_s: 5
